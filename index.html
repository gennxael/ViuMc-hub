<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViuMC - Official Hub</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        /* Bright Sunny Morning Gradient Background */
        body {
            background: linear-gradient(120deg, #ffe0e9, #ffecd2, #fcb69f, #ffebf0);
            background-size: 300% 300%;
            animation: skyMove 20s ease infinite;
            color: #333333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem; /* Padding layar diperkecil */
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
        }

        @keyframes skyMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Container for the falling Sakura petals */
        #sakura-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        /* Sakura Petal Shape and Animation */
        .petal {
            position: absolute;
            background: linear-gradient(135deg, #ffb7c5, #ff8da1);
            border-radius: 15px 0px 15px 0px;
            box-shadow: 0 0 10px rgba(255, 183, 197, 0.6);
            opacity: 0;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { top: -10%; opacity: 0; transform: translateX(0) rotate(0deg); }
            10% { opacity: 0.9; }
            80% { opacity: 0.9; }
            100% { top: 110%; opacity: 0; transform: translateX(150px) rotate(360deg); }
        }

        header {
            text-align: center;
            margin-bottom: 2rem; /* Jarak header ke kotak diperkecil */
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Profile Picture Styling */
        .profile-pic {
            width: 110px; /* Ukuran foto diperkecil sedikit */
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ffffff;
            box-shadow: 0 8px 20px rgba(255, 105, 180, 0.4);
            margin-bottom: 0.8rem;
            background-color: #ffecd2;
            transition: transform 0.4s ease;
        }
        
        .profile-pic:hover {
            transform: scale(1.1) rotate(5deg);
        }

        h1 {
            font-size: 2.8rem; /* Ukuran judul diperkecil */
            font-weight: 700;
            background: linear-gradient(90deg, #ff0844, #ffb199);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.2rem;
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.3);
        }

        header p {
            color: #555555;
            font-size: 1rem; /* Ukuran deskripsi diperkecil */
            font-weight: 600;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 0.9rem; /* Jarak antar kotak diperkecil */
            width: 100%;
            max-width: 450px; /* Lebar maksimal kotak diperkecil */
            z-index: 1;
        }

        /* --- BAGIAN KOTAK (CARD) YANG DIPERKECIL --- */
        .card {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 14px;
            padding: 0.8rem 1.2rem; /* <-- INI YANG MEMBUAT KOTAK LEBIH SLIM */
            text-decoration: none;
            color: #333333;
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(255, 105, 180, 0.15);
            transition: all 0.3s ease;
        }

        .card::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            width: 5px;
            height: 100%;
            transition: width 0.3s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.65);
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.3);
        }
        .card:hover::before {
            width: 10px;
        }

        /* --- ICON DIPERKECIL --- */
        .card-icon {
            font-size: 1.8rem; /* Ukuran icon lebih kecil */
            width: 50px;
            display: flex;
            justify-content: center;
            margin-right: 12px;
            transition: transform 0.3s ease;
        }

        .card:hover .card-icon {
            transform: scale(1.15);
        }

        /* --- TEKS DI DALAM KOTAK DIPERKECIL --- */
        .card-text {
            display: flex;
            flex-direction: column;
        }

        .card h2 {
            font-size: 1.1rem; /* Judul sosmed lebih kecil */
            font-weight: 700;
            margin-bottom: 0; /* Jarak teks h2 ke p dihilangkan agar rapat */
        }

        .card p {
            font-size: 0.75rem; /* Deskripsi sosmed lebih kecil */
            color: #666666;
            font-weight: 600;
        }

        /* Brand Colors */
        .discord::before { background: #5865F2; }
        .discord .card-icon { color: #5865F2; }

        .tiktok::before { background: linear-gradient(180deg, #00f2fe, #ff0050); }
        .tiktok .card-icon { color: #000000; }
        .tiktok h2 { text-shadow: 1px 1px 0px rgba(255,0,80,0.4), -1px -1px 0px rgba(0,242,254,0.4); }

        .wa-channel::before { background: #25D366; }
        .wa-channel .card-icon { color: #25D366; }

        .wa-chat::before { background: #128C7E; }
        .wa-chat .card-icon { color: #128C7E; }

        .saweria::before { background: #FA9C23; }
        .saweria .card-icon { color: #FA9C23; }

        footer {
            margin-top: 3rem;
            color: #666666;
            font-size: 0.85rem;
            font-weight: 600;
            z-index: 1;
        }

        /* Tampilan khusus untuk layar HP agar lebih pas lagi */
        @media (max-width: 480px) {
            h1 { font-size: 2.3rem; }
            .card { padding: 0.7rem 1rem; }
            .card-icon { font-size: 1.6rem; width: 45px; margin-right: 10px; }
            .card h2 { font-size: 1rem; }
            .card p { font-size: 0.7rem; }
        }
    </style>
</head>
<body>

    <!-- Sakura Animation Layer -->

    </main>

    <footer>
        <p>&copy; 2026 ViuMC. All rights reserved.</p>
    </footer>

    <!-- JavaScript to generate falling Sakura Petals -->
    <script>
        const container = document.getElementById('sakura-container');
        
        function createPetal() {
            const petal = document.createElement('div');
            petal.classList.add('petal');
            
            const size = Math.random() * 8 + 8; // Ukuran sakura sedikit diperkecil
            petal.style.width = `${size}px`;
            petal.style.height = `${size}px`;
            
            petal.style.left = `${Math.random() * 100}vw`; 
            
            const duration = Math.random() * 4 + 5; 
            petal.style.animationDuration = `${duration}s`;
            
            container.appendChild(petal);
            
            setTimeout(() => {
                petal.remove();
            }, duration * 1000);
        }

        setInterval(createPetal, 400);
    </script>

</body>
</html>
