<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViuMC - Official Hub</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        /* Animated Dark Gradient Background to give depth */
        body {
            background: linear-gradient(-45deg, #0a0a12, #18192a, #0d1b2a, #1a0b1c);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3rem 1rem;
            position: relative;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating Light Orbs for 3D Glass Distortion */
        .orb-1, .orb-2 {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.5;
            animation: float 10s infinite alternate;
        }
        .orb-1 {
            width: 300px; height: 300px;
            background: #5865F2; /* Discord Blurple */
            top: 5%; left: -50px;
        }
        .orb-2 {
            width: 250px; height: 250px;
            background: #25D366; /* WA Green */
            bottom: 5%; right: -50px;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(30px) scale(1.2); }
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            z-index: 1;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 700;
            text-shadow: 0 4px 20px rgba(0,0,0,0.5);
            background: linear-gradient(90deg, #ffffff, #b3b9c5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        header p {
            color: #b3b9c5;
            font-size: 1.1rem;
            font-weight: 300;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            width: 100%;
            max-width: 500px; /* Kept slim for mobile-first feel */
            z-index: 1;
        }

        /* Upgraded 3D Glass Cards */
        .card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            /* Highlight top and left borders to look like light reflecting off glass */
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            border-left: 1px solid rgba(255, 255, 255, 0.15);
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
            border-right: 1px solid rgba(255, 255, 255, 0.02);
            border-radius: 16px;
            padding: 1.2rem 1.5rem;
            text-decoration: none;
            color: white;
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
            /* Heavy shadow to pop off the page */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        /* Brand Accent Line on the left */
        .card::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            width: 5px;
            height: 100%;
            transition: width 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.08);
        }
        .card:hover::before {
            width: 10px;
        }

        /* Card Content Layout */
        .card-icon {
            font-size: 2.2rem;
            width: 60px;
            display: flex;
            justify-content: center;
            margin-right: 15px;
            transition: transform 0.3s ease;
        }

        .card:hover .card-icon {
            transform: scale(1.15);
        }

        .card-text {
            display: flex;
            flex-direction: column;
        }

        .card h2 {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.2rem;
        }

        .card p {
            font-size: 0.85rem;
            color: #a0a5b5;
        }

        /* Unique Brand Colors & Glows */
        /* Discord */
        .discord::before { background: #5865F2; }
        .discord .card-icon { color: #5865F2; filter: drop-shadow(0 0 12px rgba(88,101,242,0.6)); }
        .discord:hover { box-shadow: 0 15px 35px rgba(88, 101, 242, 0.2); }

        /* TikTok */
        .tiktok::before { background: linear-gradient(180deg, #00f2fe, #ff0050); }
        .tiktok .card-icon { color: #fff; filter: drop-shadow(0 0 10px rgba(255,255,255,0.4)); }
        .tiktok h2 { text-shadow: 1px 1px 0px #ff0050, -1px -1px 0px #00f2fe; }
        .tiktok:hover { box-shadow: 0 15px 35px rgba(255, 0, 80, 0.2); }

        /* WhatsApp Channel */
        .wa-channel::before { background: #25D366; }
        .wa-channel .card-icon { color: #25D366; filter: drop-shadow(0 0 12px rgba(37,211,102,0.6)); }
        .wa-channel:hover { box-shadow: 0 15px 35px rgba(37, 211, 102, 0.2); }

        /* WhatsApp Contact */
        .wa-chat::before { background: #128C7E; }
        .wa-chat .card-icon { color: #128C7E; filter: drop-shadow(0 0 12px rgba(18,140,126,0.6)); }
        .wa-chat:hover { box-shadow: 0 15px 35px rgba(18, 140, 126, 0.2); }

        /* Saweria */
        .saweria::before { background: #FA9C23; }
        .saweria .card-icon { color: #FA9C23; filter: drop-shadow(0 0 12px rgba(250,156,35,0.6)); }
        .saweria:hover { box-shadow: 0 15px 35px rgba(250, 156, 35, 0.2); }

        footer {
            margin-top: 4rem;
            color: #5a5f6b;
            font-size: 0.9rem;
            z-index: 1;
        }

        @media (max-width: 480px) {
            h1 { font-size: 2.8rem; }
            .card { padding: 1rem; }
            .card-icon { font-size: 1.8rem; width: 50px; margin-right: 10px; }
            .card h2 { font-size: 1.1rem; }
            .card p { font-size: 0.8rem; }
        }
    </style>
</head>
<body>

    <!-- Ambient moving orbs for background depth -->
    <div class="orb-1"></div>
    <div class="orb-2"></div>

    <header>
        <h1>ViuMC</h1>

    </header>

        <a href="https://discord.gg/z5phxJZ6b" target="_blank" class="card discord">

            <div class="card-text">
                <h2>Discord</h2>
                <p>Join our community server</p>
            </div>
        </a>

        <!-- TikTok -->
        <a href="https://www.tiktok.com/@viu.mc?_r=1&_t=ZS-99uKXKsMHQ7" target="_blank" class="card tiktok">
            <div class="card-icon"><i class="fa-brands fa-tiktok"></i></div>
            <div class="card-text">
                <h2>TikTok</h2>
                <p>Watch our latest viral clips</p>
            </div>
        </a>

        <!-- WhatsApp Channel -->
        <a href="https://whatsapp.com/channel/0029Vb6wEEiL2AU2nDW1X62j" target="_blank" class="card wa-channel">
            <div class="card-icon"><i class="fa-brands fa-whatsapp"></i></div>
            <div class="card-text">
                <h2>WA Channel</h2>
                <p>Follow for instant server updates</p>
            </div>
        </a>

        <!-- WhatsApp Chat / QR -->
        <a href="https://wa.me/qr/GYII7XQQO4WXF1" target="_blank" class="card wa-chat">
            <div class="card-icon"><i class="fa-solid fa-message"></i></div>
            <div class="card-text">
                <h2>WA Contact</h2>
                <p>Chat directly with the admin</p>
            </div>
        </a>

        <!-- Saweria Donation -->
        <a href="YOUR_SAWERIA_LINK_HERE" target="_blank" class="card saweria">
            <div class="card-icon"><i class="fa-solid fa-hand-holding-dollar"></i></div>
            <div class="card-text">
                <h2>Saweria</h2>
                <p>Support ViuMC and keep us running</p>
            </div>
        </a>

    </main>

    <footer>
        <p>&copy; 2026 ViuMC. All rights reserved.</p>
    </footer>

</body>
</html>
